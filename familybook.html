<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溫馨家庭記帳與生活日記</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v10 Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.fbModules = {
            initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy
        };
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🏡</span>
                <h1 class="font-bold text-lg text-gray-900">家庭記帳日記</h1>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 登入/身分狀態 -->
                <div id="userAuthSection" class="flex items-center space-x-2">
                    <button id="loginBtn" onclick="handleAuthAction()" class="text-xs bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition flex items-center gap-1">
                        <i class="fa-brands fa-google text-xs"></i> 登入
                    </button>
                </div>
                <!-- 設定按鈕 -->
                <button onclick="openSettingsModal()" class="text-gray-600 hover:text-primary p-1.5 rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>

        <!-- 三分頁導覽標籤 -->
        <div class="max-w-md mx-auto px-4 flex border-t border-gray-100">
            <button id="tabTimeline" onclick="switchTab('timeline')" class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 transition">
                <i class="fa-solid fa-house-chimney mr-1"></i> 家庭時軸
            </button>
            <button id="tabPersonal" onclick="switchTab('personal')" class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">
                <i class="fa-solid fa-user mr-1"></i> 個人專區
            </button>
            <button id="tabStats" onclick="switchTab('stats')" class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">
                <i class="fa-solid fa-chart-pie mr-1"></i> 統計分析
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-6">

        <!-- 家庭時軸視圖 -->
        <div id="viewTimeline" class="space-y-6">
            <!-- 總覽卡片與過濾器 -->
            <section class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-5 text-white shadow-lg">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs text-indigo-100 uppercase tracking-wider font-semibold">家庭公開總支出</p>
                        <h2 id="totalExpenseDisplay" class="text-3xl font-extrabold mt-1">$0</h2>
                    </div>
                    <div class="text-right">
                        <span id="recordCountDisplay" class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-medium">共 0 筆</span>
                    </div>
                </div>

                <!-- 檢視過濾按鈕 -->
                <div class="grid grid-cols-3 gap-1.5 mt-5 bg-white/10 p-1 rounded-xl text-xs font-medium">
                    <button onclick="setExpenseFilter('all')" id="filterBtn-all" class="py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition">全部支出</button>
                    <button onclick="setExpenseFilter('public')" id="filterBtn-public" class="py-1.5 rounded-lg text-white hover:bg-white/10 transition">公開支出</button>
                    <button onclick="setExpenseFilter('private')" id="filterBtn-private" class="py-1.5 rounded-lg text-white hover:bg-white/10 transition">個人私密</button>
                </div>
            </section>

            <!-- 快速功能按鈕 -->
            <section class="grid grid-cols-2 gap-3">
                <button onclick="openTransactionModal()" class="bg-white hover:bg-indigo-50 border border-indigo-100 text-indigo-600 font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-circle-plus text-lg"></i>
                    <span>記一筆帳</span>
                </button>
                <button onclick="openDiaryModal()" class="bg-white hover:bg-emerald-50 border border-emerald-100 text-emerald-600 font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-book-open text-lg"></i>
                    <span>寫日誌</span>
                </button>
            </section>

            <!-- 搜尋與日期篩選列 -->
            <section class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex gap-2 items-center">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="搜尋關鍵字..." class="w-full pl-8 pr-3 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <input type="date" id="dateFilterInput" onchange="renderApp()" class="px-2 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <button onclick="clearTimelineFilter()" class="text-xs text-gray-500 hover:text-gray-700 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl font-medium transition">清除</button>
            </section>

            <!-- 時間軸列表 -->
            <section class="space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-gray-800 text-base">家庭動態時軸</h3>
                    <span class="text-xs text-gray-500">自動按日期關聯</span>
                </div>
                <div id="timelineContainer" class="space-y-4"></div>
            </section>
        </div>

        <!-- 個人專區視圖 -->
        <div id="viewPersonal" class="space-y-6 hidden">
            <section class="bg-gradient-to-br from-emerald-500 to-teal-700 rounded-2xl p-5 text-white shadow-lg">
                <div class="flex items-center space-x-3 mb-4">
                    <span id="personalUserAvatar" class="text-3xl bg-white/20 p-2 rounded-full">👤</span>
                    <div>
                        <h2 id="personalUserName" class="text-lg font-bold">個人儀表板</h2>
                        <p class="text-xs text-emerald-100">專屬私密帳務與日記統計</p>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 bg-white/10 p-3 rounded-xl text-center">
                    <div>
                        <p class="text-[10px] text-emerald-100">我的總支出</p>
                        <p id="personalExpense" class="text-base font-extrabold mt-0.5">$0</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-emerald-100">我的總收入</p>
                        <p id="personalIncome" class="text-base font-extrabold mt-0.5 text-yellow-300">$0</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-emerald-100">日記篇數</p>
                        <p id="personalDiaryCount" class="text-base font-extrabold mt-0.5">0 篇</p>
                    </div>
                </div>
            </section>
            <section class="space-y-4">
                <h3 class="font-bold text-gray-800 text-base px-1">我的專屬紀錄</h3>
                <div id="personalTimelineContainer" class="space-y-4"></div>
            </section>
        </div>

        <!-- 統計分析視圖 -->
        <div id="viewStats" class="space-y-6 hidden">
            <!-- 統計範圍切換按鈕 -->
            <section class="grid grid-cols-2 gap-2 bg-gray-200 p-1 rounded-xl text-xs font-bold">
                <button id="statsScopePublic" onclick="setStatsScope('public')" class="py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">🌐 家庭公開統計</button>
                <button id="statsScopePersonal" onclick="setStatsScope('personal')" class="py-2 rounded-lg text-gray-600 hover:text-gray-900 transition">🔒 個人專區統計</button>
            </section>

            <!-- 總收支摘要卡片 -->
            <section class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-semibold">總支出</p>
                    <p id="statsTotalExpense" class="text-xl font-extrabold text-red-600 mt-1">$0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 font-semibold">總收入</p>
                    <p id="statsTotalIncome" class="text-xl font-extrabold text-emerald-600 mt-1">$0</p>
                </div>
            </section>

            <!-- 分類支出比較分析 -->
            <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-gray-800 text-sm"><i class="fa-solid fa-chart-pie text-primary mr-1"></i> 支出分類佔比比較</h3>
                    <span id="statsScopeLabel" class="text-xs text-gray-400">🌐 家庭公開</span>
                </div>
                <div id="categoryStatsContainer" class="space-y-3">
                    <!-- 動態帶入分類百分比進度條 -->
                </div>
            </section>
        </div>

    </main>

    <!-- ================= Modal：記帳表單 ================= -->
    <div id="transactionModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="txModalTitle" class="text-lg font-bold text-gray-900">新增記帳</h3>
                <button onclick="closeTransactionModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="transactionForm" onsubmit="saveTransaction(event)" class="space-y-4">
                <input type="hidden" id="txId">
                <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl">
                    <button type="button" id="typeExpense" onclick="setTxType('expense')" class="py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-red-600 transition">支出</button>
                    <button type="button" id="typeIncome" onclick="setTxType('income')" class="py-2 text-sm font-bold rounded-lg text-gray-600 transition">收入</button>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">金額 ($)</label>
                    <input type="number" id="txAmount" required placeholder="例如：250" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-lg font-bold focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">分類</label>
                        <select id="txCategory" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">付款人</label>
                        <select id="txPayer" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">日期</label>
                        <input type="date" id="txDate" required class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">瀏覽權限</label>
                        <select id="txVisibility" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                            <option value="public">🌐 全家公開</option>
                            <option value="private">🔒 僅自己可見</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">備註說明</label>
                    <input type="text" id="txNote" placeholder="例如：晚餐吃牛肉麵" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition">儲存記帳</button>
            </form>
        </div>
    </div>

    <!-- ================= Modal：日記表單 ================= -->
    <div id="diaryModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="diaryModalTitle" class="text-lg font-bold text-gray-900">寫家庭日記</h3>
                <button onclick="closeDiaryModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="diaryForm" onsubmit="saveDiary(event)" class="space-y-4">
                <input type="hidden" id="diaryId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">日記日期</label>
                    <input type="date" id="diaryDate" required class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">標題</label>
                    <input type="text" id="diaryTitle" required placeholder="例如：全家一起去公園散步" class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">心情</label>
                        <select id="diaryMood" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
                            <option value="無" selected>無</option>
                            <option value="😊">😊 開心</option>
                            <option value="🎉">🎉 慶祝</option>
                            <option value="🌧️">🌧️ 鬱悶</option>
                            <option value="❤️">❤️ 溫馨</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">天氣</label>
                        <select id="diaryWeather" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
                            <option value="無" selected>無</option>
                            <option value="☀️ 晴天">☀️ 晴天</option>
                            <option value="☁️ 多雲">☁️ 多雲</option>
                            <option value="🌧️ 雨天">🌧️ 雨天</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">瀏覽權限</label>
                        <select id="diaryVisibility" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
                            <option value="public">🌐 全家公開</option>
                            <option value="private">🔒 僅自己可見</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">內文</label>
                    <textarea id="diaryContent" rows="4" placeholder="記錄今天發生的點滴..." class="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-primary focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-emerald-700 transition">儲存日記</button>
            </form>
        </div>
    </div>

    <!-- ================= Modal：設定與管理 ================= -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">⚙️ 系統設定與管理</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-6">
                <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-sm text-indigo-900"><i class="fa-solid fa-cloud text-indigo-600 mr-1"></i> Firebase 雲端設定</h4>
                        <span id="firebaseStatus" class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">預設 Demo 模式</span>
                    </div>
                    <textarea id="firebaseConfigInput" rows="3" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "..."}' class="w-full border rounded-lg p-2 text-xs font-mono"></textarea>
                    <button onclick="saveFirebaseConfig()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold shadow-sm">儲存設定並連結</button>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                    <h4 class="font-bold text-sm text-gray-800 mb-3"><i class="fa-solid fa-users text-primary mr-1"></i> 家庭成員管理</h4>
                    <div id="memberListAdmin" class="space-y-2 mb-3"></div>
                    <form onsubmit="addMember(event)" class="flex gap-2">
                        <input type="text" id="newMemberName" placeholder="成員名稱" required class="flex-1 border rounded-lg px-3 py-1.5 text-sm">
                        <input type="text" id="newMemberAvatar" placeholder="Emoji" value="👤" class="w-16 border rounded-lg px-2 py-1.5 text-sm text-center">
                        <button type="submit" class="bg-primary text-white px-3 py-1.5 rounded-lg text-sm font-bold">新增</button>
                    </form>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                    <h4 class="font-bold text-sm text-gray-800 mb-3"><i class="fa-solid fa-tags text-secondary mr-1"></i> 記帳分類管理</h4>
                    <div id="categoryListAdmin" class="space-y-2 mb-3 max-h-40 overflow-y-auto"></div>
                    <form onsubmit="addCategory(event)" class="space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="newCategoryName" placeholder="分類名稱" required class="flex-1 border rounded-lg px-3 py-1.5 text-sm">
                            <input type="text" id="newCategoryIcon" placeholder="Icon" value="🍔" class="w-16 border rounded-lg px-2 py-1.5 text-sm text-center">
                        </div>
                        <div class="flex gap-2">
                            <select id="newCategoryType" class="flex-1 border rounded-lg px-3 py-1.5 text-sm">
                                <option value="expense">支出分類</option>
                                <option value="income">收入分類</option>
                            </select>
                            <button type="submit" class="bg-secondary text-white px-4 py-1.5 rounded-lg text-sm font-bold">新增分類</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        let members = JSON.parse(localStorage.getItem('family_members')) || [
            { id: 'm1', name: '爸爸', avatar: '👨' },
            { id: 'm2', name: '媽媽', avatar: '👩' },
            { id: 'm3', name: '小寶', avatar: '👦' }
        ];

        let categories = JSON.parse(localStorage.getItem('family_categories')) || [
            { id: 'c1', name: '餐飲美食', type: 'expense', icon: '🍜' },
            { id: 'c2', name: '交通油資', type: 'expense', icon: '⛽' },
            { id: 'c3', name: '購物娛樂', type: 'expense', icon: '🛍️' },
            { id: 'c4', name: '居家水電', type: 'expense', icon: '🏠' },
            { id: 'c5', name: '薪資收入', type: 'income', icon: '💰' }
        ];

        let transactions = JSON.parse(localStorage.getItem('family_transactions')) || [
            { id: 't1', date: getTodayStr(), type: 'expense', amount: 350, category_id: 'c1', payer_id: 'm1', note: '全家晚餐牛肉麵', visibility: 'public', userUid: 'demo1' },
            { id: 't2', date: getTodayStr(), type: 'expense', amount: 1200, category_id: 'c2', payer_id: 'm2', note: '汽車加油', visibility: 'public', userUid: 'demo2' }
        ];

        let diaries = JSON.parse(localStorage.getItem('family_diaries')) || [
            { id: 'd1', date: getTodayStr(), author_id: 'm1', title: '週末公園散步', content: '今天帶小寶去公園踢球，晚餐吃了美味牛肉麵。', mood: '😊', weather: '☀️ 晴天', visibility: 'public', userUid: 'demo1' }
        ];

        let currentUser = null;
        let currentTab = 'timeline';
        let currentExpenseFilter = 'all';
        let currentTxType = 'expense';
        let currentStatsScope = 'public'; // 'public' 或 'personal'
        let db = null;
        let auth = null;

        function getTodayStr() { return new Date().toISOString().split('T')[0]; }

        window.onload = function() {
            initFirebase();
            initFormSelects();
            renderApp();
            document.getElementById('txDate').value = getTodayStr();
            document.getElementById('diaryDate').value = getTodayStr();
        };

        function initFirebase() {
            const savedConfig = localStorage.getItem('firebase_config');
            if (savedConfig && window.fbModules) {
                try {
                    const config = JSON.parse(savedConfig);
                    const app = window.fbModules.initializeApp(config);
                    auth = window.fbModules.getAuth(app);
                    db = window.fbModules.getFirestore(app);
                    document.getElementById('firebaseStatus').innerText = 'Cloud 已連線';
                    document.getElementById('firebaseStatus').className = 'text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold';
                    window.fbModules.onAuthStateChanged(auth, (user) => {
                        if (user) {
                            currentUser = {
                                uid: user.uid,
                                name: user.displayName || '家庭成員',
                                avatar: user.photoURL ? `<img src="${user.photoURL}" class="w-5 h-5 rounded-full inline">` : '👤'
                            };
                            updateAuthUI();
                            listenCloudData();
                        } else {
                            currentUser = null;
                            updateAuthUI();
                        }
                    });
                } catch (e) { console.error(e); }
            } else {
                currentUser = { uid: 'demo1', name: '爸爸 (Demo)', avatar: '👨' };
                updateAuthUI();
            }
        }

        function updateAuthUI() {
            const container = document.getElementById('userAuthSection');
            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center space-x-1.5 text-xs bg-gray-100 px-2 py-1 rounded-lg">
                        <span>${currentUser.avatar}</span>
                        <span class="font-bold text-gray-800">${currentUser.name}</span>
                        <button onclick="handleAuthAction()" class="text-gray-400 hover:text-red-500 ml-1"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="handleAuthAction()" class="text-xs bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold px-2.5 py-1.5 rounded-lg hover:bg-indigo-100 transition flex items-center gap-1">
                        <i class="fa-brands fa-google text-xs"></i> 登入
                    </button>
                `;
            }
            renderApp();
        }

        async function handleAuthAction() {
            if (!auth) { alert('請先設定 Firebase 憑證'); openSettingsModal(); return; }
            if (currentUser && auth.currentUser) {
                await window.fbModules.signOut(auth);
            } else {
                const provider = new window.fbModules.GoogleAuthProvider();
                try { await window.fbModules.signInWithPopup(auth, provider); } catch (e) { alert(e.message); }
            }
        }

        function listenCloudData() {
            if (!db) return;
            window.fbModules.onSnapshot(window.fbModules.collection(db, 'transactions'), (snap) => {
                transactions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp();
            });
            window.fbModules.onSnapshot(window.fbModules.collection(db, 'diaries'), (snap) => {
                diaries = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderApp();
            });
        }

        function saveData() {
            localStorage.setItem('family_members', JSON.stringify(members));
            localStorage.setItem('family_categories', JSON.stringify(categories));
            if (!db) {
                localStorage.setItem('family_transactions', JSON.stringify(transactions));
                localStorage.setItem('family_diaries', JSON.stringify(diaries));
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabs = ['timeline', 'personal', 'stats'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
                const view = document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 transition";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition";
                    view.classList.add('hidden');
                }
            });
            renderApp();
        }

        function initFormSelects() {
            document.getElementById('txCategory').innerHTML = categories.filter(c => c.type === currentTxType).map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
            document.getElementById('txPayer').innerHTML = members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('');
        }

        function setTxType(type) {
            currentTxType = type;
            document.getElementById('typeExpense').className = type === 'expense' ? "py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-red-600 transition" : "py-2 text-sm font-bold rounded-lg text-gray-600 transition";
            document.getElementById('typeIncome').className = type === 'income' ? "py-2 text-sm font-bold rounded-lg bg-white shadow-sm text-emerald-600 transition" : "py-2 text-sm font-bold rounded-lg text-gray-600 transition";
            initFormSelects();
        }

        function setExpenseFilter(filter) {
            currentExpenseFilter = filter;
            ['all', 'public', 'private'].forEach(f => {
                document.getElementById(`filterBtn-${f}`).className = f === filter ? "py-1.5 rounded-lg bg-white text-indigo-700 shadow-sm transition" : "py-1.5 rounded-lg text-white hover:bg-white/10 transition";
            });
            renderApp();
        }

        function setStatsScope(scope) {
            currentStatsScope = scope;
            const btnPublic = document.getElementById('statsScopePublic');
            const btnPersonal = document.getElementById('statsScopePersonal');
            const label = document.getElementById('statsScopeLabel');

            if (scope === 'public') {
                btnPublic.className = "py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition";
                btnPersonal.className = "py-2 rounded-lg text-gray-600 hover:text-gray-900 transition";
                label.innerText = "🌐 家庭公開";
            } else {
                btnPersonal.className = "py-2 rounded-lg bg-white shadow-sm text-emerald-600 transition";
                btnPublic.className = "py-2 rounded-lg text-gray-600 hover:text-gray-900 transition";
                label.innerText = "🔒 個人專區";
            }
            renderStatsView();
        }

        function clearTimelineFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('dateFilterInput').value = '';
            renderApp();
        }

        function canViewItem(item) {
            if (item.visibility === 'public') return true;
            return currentUser && item.userUid === currentUser.uid;
        }

        function renderApp() {
            if (currentTab === 'timeline') renderTimelineView();
            else if (currentTab === 'personal') renderPersonalView();
            else if (currentTab === 'stats') renderStatsView();
        }

        function renderTimelineView() {
            const keyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value.trim().toLowerCase() : '';
            const dateFilter = document.getElementById('dateFilterInput') ? document.getElementById('dateFilterInput').value : '';

            let filteredTx = transactions.filter(t => canViewItem(t));
            if (currentExpenseFilter === 'public') filteredTx = filteredTx.filter(t => t.visibility === 'public');
            if (currentExpenseFilter === 'private') filteredTx = filteredTx.filter(t => t.visibility === 'private');

            let filteredDiaries = diaries.filter(d => canViewItem(d));

            if (dateFilter) {
                filteredTx = filteredTx.filter(t => t.date === dateFilter);
                filteredDiaries = filteredDiaries.filter(d => d.date === dateFilter);
            }
            if (keyword) {
                filteredTx = filteredTx.filter(t => (t.note || '').toLowerCase().includes(keyword) || String(t.amount).includes(keyword));
                filteredDiaries = filteredDiaries.filter(d => (d.title || '').toLowerCase().includes(keyword) || (d.content || '').toLowerCase().includes(keyword));
            }

            const totalExpense = filteredTx.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
            document.getElementById('totalExpenseDisplay').innerText = `$${totalExpense.toLocaleString()}`;
            document.getElementById('recordCountDisplay').innerText = `共 ${filteredTx.length + filteredDiaries.length} 筆`;

            const allDates = new Set([...filteredTx.map(t => t.date), ...filteredDiaries.map(d => d.date)]);
            const sortedDates = Array.from(allDates).sort((a, b) => new Date(b) - new Date(a));

            const container = document.getElementById('timelineContainer');
            container.innerHTML = sortedDates.length === 0 ? `<div class="text-center py-10 text-gray-400 text-sm">沒有符合條件的動態紀錄</div>` : sortedDates.map(date => renderDayBlock(date, filteredTx, filteredDiaries)).join('');
        }

        function renderPersonalView() {
            if (!currentUser) {
                document.getElementById('personalTimelineContainer').innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">請先登入 Google 帳號</div>`;
                return;
            }
            document.getElementById('personalUserName').innerText = `${currentUser.name} 的個人儀表板`;
            const myTxs = transactions.filter(t => t.userUid === currentUser.uid);
            const myDiaries = diaries.filter(d => d.userUid === currentUser.uid);
            document.getElementById('personalExpense').innerText = `$${myTxs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0).toLocaleString()}`;
            document.getElementById('personalIncome').innerText = `$${myTxs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0).toLocaleString()}`;
            document.getElementById('personalDiaryCount').innerText = `${myDiaries.length} 篇`;

            const allDates = new Set([...myTxs.map(t => t.date), ...myDiaries.map(d => d.date)]);
            const sortedDates = Array.from(allDates).sort((a, b) => new Date(b) - new Date(a));
            document.getElementById('personalTimelineContainer').innerHTML = sortedDates.length === 0 ? `<div class="text-center py-10 text-gray-400 text-sm">您目前還沒有建立個人紀錄</div>` : sortedDates.map(date => renderDayBlock(date, myTxs, myDiaries)).join('');
        }

        // ================= 統計分析檢視邏輯 =================
        function renderStatsView() {
            let targetTxs = [];
            if (currentStatsScope === 'public') {
                targetTxs = transactions.filter(t => t.visibility === 'public');
            } else {
                if (!currentUser) {
                    document.getElementById('categoryStatsContainer').innerHTML = `<p class="text-center text-xs text-gray-400 py-4">請先登入帳號以查看個人專區統計</p>`;
                    document.getElementById('statsTotalExpense').innerText = '$0';
                    document.getElementById('statsTotalIncome').innerText = '$0';
                    return;
                }
                targetTxs = transactions.filter(t => t.userUid === currentUser.uid);
            }

            const totalExp = targetTxs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);
            const totalInc = targetTxs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);

            document.getElementById('statsTotalExpense').innerText = `$${totalExp.toLocaleString()}`;
            document.getElementById('statsTotalIncome').innerText = `$${totalInc.toLocaleString()}`;

            // 分類支出統計進度條
            const expCategories = categories.filter(c => c.type === 'expense');
            const catContainer = document.getElementById('categoryStatsContainer');
            
            if (totalExp === 0) {
                catContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">尚無支出數據可供統計</p>`;
            } else {
                catContainer.innerHTML = expCategories.map(cat => {
                    const catSum = targetTxs.filter(t => t.type === 'expense' && t.category_id === cat.id).reduce((s, t) => s + Number(t.amount), 0);
                    const percent = totalExp > 0 ? ((catSum / totalExp) * 100).toFixed(1) : 0;
                    return `
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-gray-700">${cat.icon} ${cat.name}</span>
                                <span class="font-bold text-gray-900">$${catSum.toLocaleString()} <span class="text-gray-400 font-normal">(${percent}%)</span></span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                                <div class="bg-primary h-2 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function renderDayBlock(date, txList, diaryList) {
            const dayDiaries = diaryList.filter(d => d.date === date);
            const dayTxs = txList.filter(t => t.date === date);
            const dayExpense = dayTxs.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);

            let html = `<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="font-bold text-sm text-indigo-600"><i class="fa-regular fa-calendar-days mr-1"></i> ${date}</span>
                    <span class="text-xs text-gray-500 font-medium">當日支出: <strong class="text-red-500">$${dayExpense.toLocaleString()}</strong></span>
                </div>`;

            dayDiaries.forEach(d => {
                const author = members.find(m => m.id === d.author_id) || { name: '成員', avatar: '👤' };
                const isOwner = currentUser && d.userUid === currentUser.uid;
                const moodDisplay = (d.mood && d.mood !== '無') ? d.mood : '';
                const weatherDisplay = (d.weather && d.weather !== '無') ? d.weather : '';
                const metaInfo = [weatherDisplay, d.visibility === 'private' ? '🔒 私密' : '🌐 公開'].filter(Boolean).join(' · ');

                html += `<div class="bg-amber-50/60 border border-amber-100 rounded-xl p-3.5 space-y-2">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            ${moodDisplay ? `<span class="text-xl">${moodDisplay}</span>` : ''}
                            <div>
                                <h4 class="font-bold text-sm text-gray-900">${d.title}</h4>
                                <p class="text-xs text-gray-500">${author.avatar} ${author.name}${metaInfo ? ' · ' + metaInfo : ''}</p>
                            </div>
                        </div>
                        ${isOwner ? `<div class="flex space-x-1"><button onclick="editDiary('${d.id}')" class="text-gray-400 hover:text-indigo-600 p-1 text-xs"><i class="fa-solid fa-pen"></i></button><button onclick="deleteDiary('${d.id}')" class="text-gray-400 hover:text-red-500 p-1 text-xs"><i class="fa-solid fa-trash"></i></button></div>` : ''}
                    </div>
                    <p class="text-xs text-gray-700 whitespace-pre-line leading-relaxed">${d.content}</p>
                </div>`;
            });

            if (dayTxs.length > 0) {
                html += `<div class="space-y-1.5 pt-1">`;
                dayTxs.forEach(t => {
                    const cat = categories.find(c => c.id === t.category_id) || { name: '其他', icon: '📌' };
                    const payer = members.find(m => m.id === t.payer_id) || { name: '成員', avatar: '👤' };
                    const isExpense = t.type === 'expense';
                    const isOwner = currentUser && t.userUid === currentUser.uid;
                    html += `<div class="flex justify-between items-center bg-gray-50 hover:bg-gray-100 p-2.5 rounded-xl transition text-xs">
                        <div class="flex items-center space-x-2.5">
                            <span class="text-base bg-white p-1.5 rounded-lg shadow-xs">${cat.icon}</span>
                            <div>
                                <p class="font-bold text-gray-800">${t.note || cat.name}</p>
                                <p class="text-[10px] text-gray-500">${payer.avatar} ${payer.name} · ${cat.name} ${t.visibility === 'private' ? '🔒' : ''}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-extrabold ${isExpense ? 'text-gray-900' : 'text-emerald-600'}">${isExpense ? '-' : '+'}$${Number(t.amount).toLocaleString()}</span>
                            ${isOwner ? `<button onclick="editTransaction('${t.id}')" class="text-gray-400 hover:text-indigo-600 p-1"><i class="fa-solid fa-pen text-[10px]"></i></button><button onclick="deleteTransaction('${t.id}')" class="text-gray-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash text-[10px]"></i></button>` : ''}
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        }

        // ================= CRUD 與管理功能 =================
        function openTransactionModal(txId = null) {
            document.getElementById('transactionModal').classList.remove('hidden');
            if (txId) {
                document.getElementById('txModalTitle').innerText = '修改記帳';
                const t = transactions.find(x => x.id === txId);
                document.getElementById('txId').value = t.id;
                setTxType(t.type);
                document.getElementById('txAmount').value = t.amount;
                document.getElementById('txCategory').value = t.category_id;
                document.getElementById('txPayer').value = t.payer_id;
                document.getElementById('txDate').value = t.date;
                document.getElementById('txVisibility').value = t.visibility;
                document.getElementById('txNote').value = t.note;
            } else {
                document.getElementById('txModalTitle').innerText = '新增記帳';
                document.getElementById('transactionForm').reset();
                document.getElementById('txId').value = '';
                setTxType('expense');
                document.getElementById('txDate').value = getTodayStr();
            }
        }
        function closeTransactionModal() { document.getElementById('transactionModal').classList.add('hidden'); }

        async function saveTransaction(e) {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const data = {
                type: currentTxType,
                amount: Number(document.getElementById('txAmount').value),
                category_id: document.getElementById('txCategory').value,
                payer_id: document.getElementById('txPayer').value,
                date: document.getElementById('txDate').value,
                visibility: document.getElementById('txVisibility').value,
                note: document.getElementById('txNote').value,
                userUid: currentUser ? currentUser.uid : 'demo1'
            };
            if (db) {
                if (id) await window.fbModules.updateDoc(window.fbModules.doc(db, 'transactions', id), data);
                else await window.fbModules.addDoc(window.fbModules.collection(db, 'transactions'), data);
            } else {
                if (id) {
                    const idx = transactions.findIndex(x => x.id === id);
                    if (idx !== -1) transactions[idx] = { id, ...data };
                } else {
                    transactions.push({ id: 't_' + Date.now(), ...data });
                }
                saveData();
                renderApp();
            }
            closeTransactionModal();
        }

        function editTransaction(id) { openTransactionModal(id); }
        async function deleteTransaction(id) {
            if (confirm('確定要刪除這筆記帳嗎？')) {
                if (db) await window.fbModules.deleteDoc(window.fbModules.doc(db, 'transactions', id));
                else { transactions = transactions.filter(t => t.id !== id); saveData(); renderApp(); }
            }
        }

        function openDiaryModal(diaryId = null) {
            document.getElementById('diaryModal').classList.remove('hidden');
            if (diaryId) {
                document.getElementById('diaryModalTitle').innerText = '修改日記';
                const d = diaries.find(x => x.id === diaryId);
                document.getElementById('diaryId').value = d.id;
                document.getElementById('diaryDate').value = d.date;
                document.getElementById('diaryTitle').value = d.title;
                document.getElementById('diaryMood').value = d.mood || '無';
                document.getElementById('diaryWeather').value = d.weather || '無';
                document.getElementById('diaryVisibility').value = d.visibility;
                document.getElementById('diaryContent').value = d.content;
            } else {
                document.getElementById('diaryModalTitle').innerText = '寫家庭日記';
                document.getElementById('diaryForm').reset();
                document.getElementById('diaryId').value = '';
                document.getElementById('diaryMood').value = '無';
                document.getElementById('diaryWeather').value = '無';
                document.getElementById('diaryDate').value = getTodayStr();
            }
        }
        function closeDiaryModal() { document.getElementById('diaryModal').classList.add('hidden'); }

        async function saveDiary(e) {
            e.preventDefault();
            const id = document.getElementById('diaryId').value;
            const data = {
                date: document.getElementById('diaryDate').value,
                author_id: members[0] ? members[0].id : 'm1',
                title: document.getElementById('diaryTitle').value,
                mood: document.getElementById('diaryMood').value,
                weather: document.getElementById('diaryWeather').value,
                visibility: document.getElementById('diaryVisibility').value,
                content: document.getElementById('diaryContent').value,
                userUid: currentUser ? currentUser.uid : 'demo1'
            };
            if (db) {
                if (id) await window.fbModules.updateDoc(window.fbModules.doc(db, 'diaries', id), data);
                else await window.fbModules.addDoc(window.fbModules.collection(db, 'diaries'), data);
            } else {
                if (id) {
                    const idx = diaries.findIndex(x => x.id === id);
                    if (idx !== -1) diaries[idx] = { id, ...data };
                } else {
                    diaries.push({ id: 'd_' + Date.now(), ...data });
                }
                saveData();
                renderApp();
            }
            closeDiaryModal();
        }

        function editDiary(id) { openDiaryModal(id); }
        async function deleteDiary(id) {
            if (confirm('確定要刪除這篇日記嗎？')) {
                if (db) await window.fbModules.deleteDoc(window.fbModules.doc(db, 'diaries', id));
                else { diaries = diaries.filter(d => d.id !== id); saveData(); renderApp(); }
            }
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); renderAdminLists(); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); initFormSelects(); renderApp(); }

        function saveFirebaseConfig() {
            const raw = document.getElementById('firebaseConfigInput').value.trim();
            if (!raw) return;
            try {
                JSON.parse(raw);
                localStorage.setItem('firebase_config', raw);
                alert('Firebase 設定儲存成功！將重新載入');
                location.reload();
            } catch (e) { alert('JSON 格式錯誤'); }
        }

        function renderAdminLists() {
            document.getElementById('memberListAdmin').innerHTML = members.map(m => `
                <div class="flex justify-between items-center bg-white p-2 rounded-lg border text-xs gap-2">
                    <span class="w-8 text-center text-base">${m.avatar}</span>
                    <span class="font-bold flex-1 truncate">${m.name}</span>
                    <button onclick="editMemberPrompt('${m.id}')" class="text-indigo-600 px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteMember('${m.id}')" class="text-red-500 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');

            document.getElementById('categoryListAdmin').innerHTML = categories.map(c => `
                <div class="flex justify-between items-center bg-white p-2 rounded-lg border text-xs gap-2">
                    <span class="w-8 text-center text-base">${c.icon}</span>
                    <span class="font-bold flex-1 truncate">${c.name} <span class="text-gray-400 font-normal">(${c.type === 'expense' ? '支出' : '收入'})</span></span>
                    <button onclick="editCategoryPrompt('${c.id}')" class="text-indigo-600 px-2 py-1"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addMember(e) {
            e.preventDefault();
            const name = document.getElementById('newMemberName').value.trim();
            const avatar = document.getElementById('newMemberAvatar').value.trim() || '👤';
            if (name) { members.push({ id: 'm_' + Date.now(), name, avatar }); saveData(); document.getElementById('newMemberName').value = ''; renderAdminLists(); }
        }
        function editMemberPrompt(id) {
            const m = members.find(x => x.id === id);
            if (!m) return;
            const newName = prompt('修改成員名稱：', m.name);
            if (newName === null) return;
            const newAvatar = prompt('修改成員圖示 (Emoji)：', m.avatar);
            if (newAvatar === null) return;
            if (newName.trim()) { m.name = newName.trim(); m.avatar = newAvatar.trim() || m.avatar; saveData(); renderAdminLists(); }
        }
        function deleteMember(id) {
            if (members.length <= 1) { alert('至少需保留一位成員'); return; }
            members = members.filter(m => m.id !== id); saveData(); renderAdminLists();
        }

        function addCategory(e) {
            e.preventDefault();
            const name = document.getElementById('newCategoryName').value.trim();
            const icon = document.getElementById('newCategoryIcon').value.trim() || '📌';
            const type = document.getElementById('newCategoryType').value;
            if (name) { categories.push({ id: 'c_' + Date.now(), name, type, icon }); saveData(); document.getElementById('newCategoryName').value = ''; renderAdminLists(); }
        }
        function editCategoryPrompt(id) {
            const c = categories.find(x => x.id === id);
            if (!c) return;
            const newName = prompt('修改分類名稱：', c.name);
            if (newName === null) return;
            const newIcon = prompt('修改分類圖示 (Icon)：', c.icon);
            if (newIcon === null) return;
            if (newName.trim()) { c.name = newName.trim(); c.icon = newIcon.trim() || c.icon; saveData(); renderAdminLists(); }
        }
        function deleteCategory(id) {
            categories = categories.filter(c => c.id !== id); saveData(); renderAdminLists();
        }
    </script>
</body>
</html>
